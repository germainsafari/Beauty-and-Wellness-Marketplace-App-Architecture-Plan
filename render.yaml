# Render Blueprint — Hafi API
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: hafi-web
    runtime: node
    region: frankfurt
    plan: free
    rootDir: .
    buildCommand: npm install && npm run web:build
    startCommand: npm run web:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        sync: false

  - type: web
    name: hafi-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: .
    buildCommand: npm install && npm run db:push --workspace=@hafi/api
    startCommand: npm run start --workspace=@hafi/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false

